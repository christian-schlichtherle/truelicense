# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
concurrency:
  cancel-in-progress: true
  group: test-${{ github.ref }}
jobs:
  # The Java 8 compatibility gate: maven.compiler.source/target is 1.8 with no --release, so javac 8 is the only
  # thing that proves no post-8 API has crept in. The sonatype-oss-release profile additionally runs
  # verify-obfuscate-main-classes, which is release-only on purpose - see CLAUDE.md.
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          cache: maven
          distribution: temurin
          java-version: '8'
      - name: Compile with Maven
        run: ./mvnw --show-version --batch-mode -DskipTests=true -Dgpg.skip=true --activate-profiles sonatype-oss-release install
  # Runs the full test suite on every LTS release since 8. This job does not depend on `compile`: `verify` builds
  # the whole reactor from scratch, so the two are independent and run in parallel.
  test:
    name: test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11', '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          cache: maven
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Test with Maven
        run: ./mvnw --show-version --batch-mode verify
name: test
on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ '**' ]
  # A tag push does not match the branch filters above, so the release workflow calls this one as a gate.
  workflow_call:
